summary: A slim, graceful blue cat with a silvery shimmer and vivid green eyes.
traits:
  - text: Short, dense double coat in even blue-gray, with silver-tipped hairs that give it a shimmer.
    source: cfa
  - text: Vivid green eyes.
    source: cfa
  - text: Fine-boned, long and graceful body on long legs - slimmer than a British Shorthair or Chartreux.
    source: cfa
  - text: Upturned corners of the mouth give a slight "smile".
    source: wikipedia
lookAlikes: [ chartreux, british-shorthair ]
