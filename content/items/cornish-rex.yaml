slug: cornish-rex
name: Cornish Rex
category: unusual
attributes:
  origin: United Kingdom
  size: Small to medium
  lifespan: 11-15 years
imageQuery: crex
summary: A whippet-shaped cat with tight, even waves in its short coat and a high, arched back.
traits:
  - text: Short coat in tight, even "marcel" waves lying close to the body - it has no outer guard hairs.
    source: wikipedia
  - text: Tall, slender body with an arched back and a tucked-up waist, like a whippet.
    source: cfa
  - text: Egg-shaped head with a Roman nose and large ears set high on the head.
    source: cfa
