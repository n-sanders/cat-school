slug: norwegian-forest-cat
name: Norwegian Forest Cat
category: longhair
attributes:
  origin: Norway
  size: Large
  lifespan: 14-16 years
imageQuery: norw
summary: A big Scandinavian forest cat with a triangular head, straight profile and water-resistant double coat.
traits:
  - text: Triangle-shaped head with a straight profile - the nose runs in one straight line from brow to tip.
    source: cfa
  - text: Thick, water-resistant double coat with a full ruff and a long, bushy tail.
    source: cfa
  - text: Back legs longer than the front legs, so the rump sits higher than the shoulders.
    source: cfa
lookAlikes: [ maine-coon, siberian ]
