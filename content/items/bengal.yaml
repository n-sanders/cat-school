slug: bengal
name: Bengal
category: shorthair
attributes:
  origin: United States
  size: Medium to large
  lifespan: 12-16 years
imageQuery: beng
summary: A muscular, wild-looking cat with leopard-like rosettes or marbling, descended from the Asian leopard cat.
traits:
  - text: Spotted or marbled coat; the best spots are two-toned "rosettes" like a leopard's.
    source: cfa
  - text: Developed by crossing domestic cats with the wild Asian leopard cat.
    source: wikipedia
  - text: Many Bengals have "glitter" - a sparkly sheen on the coat.
    source: wikipedia
  - text: Large, long, muscular body with a broad nose and small, rounded ears.
    source: cfa
lookAlikes: [ egyptian-mau, ocicat ]
