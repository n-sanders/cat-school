slug: scottish-fold
name: Scottish Fold
category: shorthair
attributes:
  origin: Scotland
  size: Medium
  lifespan: 11-14 years
imageQuery: sfol
summary: A round-faced cat whose small ears fold forward and down, giving it an owl-like look.
traits:
  - text: Small ears folded forward and downward, caused by a natural gene mutation.
    source: cfa
  - text: Round head, large round eyes and a short neck give an owl-like expression.
    source: cfa
  - text: Not every Scottish Fold kitten has folded ears - some are born with straight ears.
    source: wikipedia
