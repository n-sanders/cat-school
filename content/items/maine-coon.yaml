summary: One of the largest domestic breeds - a shaggy, rugged cat with tufted ears and a long, bushy tail.
traits:
  - text: Large, long, rectangular body - one of the biggest domestic cat breeds.
    source: cfa
  - text: Shaggy coat, shorter on the shoulders and longer on the belly and britches, with a ruff on the chest.
    source: cfa
  - text: Large ears, often with lynx-like tufts at the tips, and a square muzzle.
    source: cfa
  - text: Long, bushy, flowing tail.
    source: wikipedia
