slug: british-shorthair
name: British Shorthair
category: shorthair
attributes:
  origin: United Kingdom
  size: Medium to large
  lifespan: 12-17 years
imageQuery: bsho
summary: A big, round, teddy-bear cat with a dense, plush coat, most famous in blue.
traits:
  - text: Round head with full, chubby cheeks and a short, broad nose.
    source: cfa
  - text: Large, round eyes, usually copper or gold in blue cats.
    source: cfa
  - text: Compact, broad-chested ("cobby") body on short, thick legs.
    source: cfa
  - text: Very dense, plush coat that feels firm to the touch. Blue-gray ("British Blue") is the best-known color.
    source: wikipedia
