slug: abyssinian
name: Abyssinian
category: shorthair
attributes:
  origin: United Kingdom (named for Abyssinia)
  size: Medium
  lifespan: 14-17 years
imageQuery: abys
summary: A lithe, alert cat with a "ticked" coat - every hair banded, but no spots or stripes on the body.
traits:
  - text: Ticked coat - each hair has bands of dark and light color - giving a warm, glowing look with no spots or stripes on the body.
    source: cfa
  - text: Ruddy (warm reddish-brown) is the classic color.
    source: cfa
  - text: Large, alert ears and almond-shaped gold or green eyes.
    source: cfa
  - text: Lithe, medium-sized, muscular body that looks ready to spring.
    source: wikipedia
