slug: oriental
name: Oriental Shorthair
category: shorthair
attributes:
  origin: United States
  size: Small to medium
  lifespan: 12-15 years
imageQuery: orie
summary: A Siamese body in hundreds of colors and patterns, with very large ears and usually green eyes.
traits:
  - text: Same long, slender body and wedge-shaped head as the Siamese.
    source: cfa
  - text: Comes in solid colors and patterns such as tabby and bicolor - but no colorpoints.
    source: cfa
  - text: Very large ears that continue the lines of the wedge-shaped head.
    source: cfa
  - text: Eyes are usually green; white Orientals may have blue eyes.
    source: wikipedia
lookAlikes: [ siamese ]
