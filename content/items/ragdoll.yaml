slug: ragdoll
name: Ragdoll
category: longhair
attributes:
  origin: United States
  size: Large
  lifespan: 12-17 years
imageQuery: ragd
summary: A large, blue-eyed, semi-longhaired colorpoint cat in colorpoint, mitted, bicolor, and van patterns.
traits:
  - text: Colorpoint pattern with blue eyes, in four styles - colorpoint (no white), mitted (white paws, a white chin, and a white belly stripe), bicolor (a white inverted "V" on the face), and van (mostly white, with color on the ears, tail, and mask).
    source: cfa
  - text: Large, long, heavy-boned body.
    source: cfa
  - text: Semi-long, silky coat with a ruff and a long, plumed tail.
    source: cfa
