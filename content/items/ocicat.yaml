slug: ocicat
name: Ocicat
category: shorthair
attributes:
  origin: United States
  size: Medium to large
  lifespan: 12-18 years
imageQuery: ocic
summary: A large, athletic spotted cat named for the ocelot, but bred entirely from domestic cats.
traits:
  - text: Large, thumbprint-shaped spots arranged in rows over a short, satiny coat.
    source: cfa
  - text: Bred from Abyssinians and Siamese (later with American Shorthairs) - no wild blood.
    source: wikipedia
  - text: Large, athletic, solid body; the coat hairs are ticked like an Abyssinian's.
    source: cfa
lookAlikes: [ bengal, egyptian-mau, abyssinian ]
